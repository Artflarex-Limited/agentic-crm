[tool.poetry]
name = "agentic-crm-backend"
version = "0.1.0"
description = "AI-powered CRM with autonomous agents"
authors = ["Artflarex Solutions <dev@artflarex.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
asyncpg = "^0.29.0"
alembic = "^1.13.2"
greenlet = "^3.0.3"
redis = "^5.0.8"
celery = "^5.4.0"
langchain = "^0.3.0"
langchain-community = "^0.2.0"
openai = "^1.40.0"
httpx = "^0.27.0"
beautifulsoup4 = "^4.12.3"
playwright = "^1.44.0"
emails = "^0.5.16"
aiosmtplib = "^3.0.0"
python-dotenv = "^1.0.1"
python-multipart = "^0.0.9"
tenacity = "^8.3.0"
jinja2 = "^3.1.4"
sentry-sdk = {extras = ["fastapi"], version = "^2.8.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
aiosqlite = "^0.20.0"
ruff = "^0.4.0"
black = "^24.4.2"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"