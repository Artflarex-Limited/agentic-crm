<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artflarex — Instagram Highlight Icons</title>
  <style>
    body {
      background: #0A1628;
      width: 600px;
      height: 600px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
    }
    .icon-container {
      width: 145px;
      height: 145px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1E32;
      border-radius: 30px;
    }
    .icon-container svg {
      width: 60px;
      height: 60px;
      margin-bottom: 8px;
    }
    .icon-container span {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: #94A3B8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Icon 1: Product Demo -->
  <div class="icon-container">
    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="60" rx="16" fill="url(#g1)"/>
      <path d="M15 30L25 20L35 30L25 40L15 30Z" fill="white" opacity="0.9"/>
      <path d="M30 15L40 5L50 15L40 25L30 15Z" fill="white" opacity="0.6"/>
      <path d="M30 45L40 35L50 45L40 55L30 45Z" fill="white" opacity="0.6"/>
      <defs><linearGradient id="g1" x1="0" y1="0" x2="60" y2="60"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
    </svg>
    <span>Product Demo</span>
  </div>
  <!-- Icon 2: Company Culture -->
  <div class="icon-container">
    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="60" rx="16" fill="url(#g2)"/>
      <circle cx="30" cy="22" r="10" fill="white" opacity="0.8"/>
      <path d="M15 50C15 38 22 30 30 30C38 30 45 38 45 50" fill="white" opacity="0.6"/>
      <defs><linearGradient id="g2" x1="0" y1="0" x2="60" y2="60"><stop stop-color="#10B981"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
    </svg>
    <span>Culture</span>
  </div>
  <!-- Icon 3: Tech Insights -->
  <div class="icon-container">
    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="60" rx="16" fill="url(#g3)"/>
      <path d="M20 40L30 20L40 40" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <circle cx="30" cy="42" r="4" fill="white" opacity="0.8"/>
      <defs><linearGradient id="g3" x1="0" y1="0" x2="60" y2="60"><stop stop-color="#06B6D4"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
    </svg>
    <span>Tech Insights</span>
  </div>
  <!-- Icon 4: Customer Stories -->
  <div class="icon-container">
    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="60" rx="16" fill="url(#g4)"/>
      <path d="M15 35C15 25 22 18 30 18C38 18 45 25 45 35C45 42 40 48 30 48C25 48 20 46 18 43" stroke="white" stroke-width="3" opacity="0.8"/>
      <circle cx="22" cy="25" r="4" fill="white" opacity="0.6"/>
      <circle cx="38" cy="25" r="4" fill="white" opacity="0.6"/>
      <defs><linearGradient id="g4" x1="0" y1="0" x2="60" y2="60"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
    </svg>
    <span>Stories</span>
  </div>
</body>
</html>
