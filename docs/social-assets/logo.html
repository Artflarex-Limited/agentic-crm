<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artflarex Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 400px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 400px;
      height: 400px;
      position: relative;
    }
    svg {
      width: 400px;
      height: 400px;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3B82F6"/>
          <stop offset="0.5" stop-color="#06B6D4"/>
          <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
      </defs>
      <rect width="400" height="400" rx="80" fill="#0A1628"/>
      <rect x="20" y="20" width="360" height="360" rx="70" fill="url(#logoGrad)" opacity="0.1"/>
      <path d="M120 200L160 160L200 200L160 240L120 200Z" fill="white" opacity="0.95"/>
      <path d="M180 120L220 80L260 120L220 160L180 120Z" fill="white" opacity="0.75"/>
      <path d="M180 280L220 240L260 280L220 320L180 280Z" fill="white" opacity="0.75"/>
      <path d="M260 200L300 160L340 200L300 240L260 200Z" fill="white" opacity="0.55"/>
      <path d="M140 140L170 110L200 140L170 170L140 140Z" fill="white" opacity="0.3"/>
      <path d="M200 260L230 230L260 260L230 290L200 260Z" fill="white" opacity="0.3"/>
    </svg>
  </div>
</body>
</html>
