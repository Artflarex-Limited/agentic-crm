<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artflarex — X Profile Header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --deep-navy: #0A1628;
      --electric-blue: #3B82F6;
      --cyan: #06B6D4;
      --white: #FFFFFF;
      --muted: #94A3B8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--deep-navy);
      color: var(--white);
      width: 1500px;
      height: 500px;
      overflow: hidden;
    }

    .container {
      width: 1500px;
      height: 500px;
      background: linear-gradient(135deg, #0A1628 0%, #0F1E32 50%, #0A1628 100%);
      position: relative;
      display: flex;
      align-items: center;
    }

    .bg-pattern {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .content {
      position: relative;
      z-index: 10;
      padding: 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .left-content {
      max-width: 700px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 100px;
      padding: 6px 16px;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .badge-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--electric-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--white) 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 22px;
      color: var(--muted);
      line-height: 1.5;
    }

    .tagline strong {
      color: var(--white);
      font-weight: 600;
    }

    .right-content {
      text-align: right;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--white);
    }

    .hashtags {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }

    .hashtag {
      font-size: 15px;
      color: var(--electric-blue);
      font-weight: 500;
    }

    .gradient-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--electric-blue), var(--cyan), var(--electric-blue));
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div class="content">
      <div class="left-content">
        <div class="badge">
          <span class="badge-dot"></span>
          <span class="badge-text">AI-Powered ERP & CRM</span>
        </div>
        <h1>Artflarex Solutions</h1>
        <p class="tagline">The CRM that <strong>works for you</strong> — autonomous workflows, AI-powered insights, seamless integrations.</p>
      </div>

      <div class="right-content">
        <div class="logo-mark">
          <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="16" fill="url(#logoGrad)"/>
            <path d="M20 32L28 24L36 32L28 40L20 32Z" fill="white" opacity="0.9"/>
            <path d="M32 20L40 12L48 20L40 28L32 20Z" fill="white" opacity="0.7"/>
            <path d="M32 44L40 36L48 44L40 52L32 44Z" fill="white" opacity="0.7"/>
            <path d="M44 32L52 24L60 32L52 40L44 32Z" fill="white" opacity="0.5"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3B82F6"/>
                <stop offset="1" stop-color="#06B6D4"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="logo-text">Artflarex</span>
        </div>
        <div class="hashtags">
          <span class="hashtag">#AIinB2B</span>
          <span class="hashtag">#DigitalTransformation</span>
          <span class="hashtag">#CRM</span>
        </div>
      </div>
    </div>

    <div class="gradient-line"></div>
  </div>
</body>
</html>
