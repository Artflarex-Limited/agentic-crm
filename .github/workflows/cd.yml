name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  KUBECONFIG: ${{ secrets.KUBECONFIG }}

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agentic-crm.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubeconfig
        run: |
          echo "$KUBECONFIG" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubernetes images
        run: |
          kubectl set image deployment/backend backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n default
          kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} -n default
          kubectl set image deployment/celery-worker celery-worker=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n default
          kubectl set image deployment/celery-beat celery-beat=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -n default

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n default --timeout=300s
          kubectl rollout status deployment/frontend -n default --timeout=300s
          kubectl rollout status deployment/celery-worker -n default --timeout=300s
          kubectl rollout status deployment/celery-beat -n default --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n default
          kubectl get ingress -n default