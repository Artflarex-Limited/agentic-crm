name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/mustafabugraavci
  IMAGE_NAME_BACKEND: agentic-crm-backend
  IMAGE_NAME_FRONTEND: agentic-crm-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=sha

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          build-args: NEXT_PUBLIC_API_URL=https://api.${{ github.event.inputs.environment == 'production' && 'agentic-crm.com' || 'staging.agentic-crm.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy backend
        run: |
          cd kubernetes/overlays/${{ github.event.inputs.environment || 'staging' }}
          kubectl set image deployment/agentic-crm-backend backend=${{ needs.build-and-push.outputs.backend_tag }} --namespace=default
          kubectl rollout status deployment/agentic-crm-backend --namespace=default --timeout=300s

      - name: Deploy frontend
        run: |
          kubectl set image deployment/agentic-crm-frontend frontend=${{ needs.build-and-push.outputs.frontend_tag }} --namespace=default
          kubectl rollout status deployment/agentic-crm-frontend --namespace=default --timeout=300s

      - name: Deploy celery
        run: |
          kubectl set image deployment/agentic-crm-celery celery=${{ needs.build-and-push.outputs.backend_tag }} --namespace=default
          kubectl rollout status deployment/agentic-crm-celery --namespace=default --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods --namespace=default
          kubectl get ingress --namespace=default

