apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentic-crm-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - app.agentic-crm.com
      secretName: agentic-crm-tls
  rules:
    - host: app.agentic-crm.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: agentic-crm-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentic-crm-frontend
                port:
                  number: 3000