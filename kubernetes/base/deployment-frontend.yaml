apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-crm-frontend
  namespace: default
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: agentic-crm-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://agentic-crm-backend:8000"
            - name: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_ID
            - name: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL_RFQ
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL_RFQ
            - name: NEXT_PUBLIC_GA4_MEASUREMENT_ID
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: NEXT_PUBLIC_GA4_MEASUREMENT_ID
            - name: NEXT_PUBLIC_HUBSPOT_PORTAL_ID
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: NEXT_PUBLIC_HUBSPOT_PORTAL_ID
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      restartPolicy: Always