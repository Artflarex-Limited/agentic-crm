apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app: agentic-crm
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-crm
      component: celery-worker
  template:
    metadata:
      labels:
        app: agentic-crm
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: agentic-crm-backend:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: agentic-crm-config
            - secretRef:
                name: agentic-crm-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256M
            limits:
              cpu: 2000m
              memory: 1G
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.celery_app", "inspect", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3