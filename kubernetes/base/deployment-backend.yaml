apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: agentic-crm
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-crm
      component: backend
  template:
    metadata:
      labels:
        app: agentic-crm
        component: backend
    spec:
      containers:
        - name: backend
          image: agentic-crm-backend:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: agentic-crm-config
            - secretRef:
                name: agentic-crm-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512M
            limits:
              cpu: 2000m
              memory: 2G
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3