apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-crm-backend
  namespace: default
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: agentic-crm-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-crm-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-crm-secret
                  key: SECRET_KEY
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: agentic-crm-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              value: "587"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: LOG_LEVEL
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always