apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-crm-celery
  namespace: default
  labels:
    app: celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
        - name: celeryworker
          image: agentic-crm-backend:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-crm-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: agentic-crm-config
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-crm-secret
                  key: SECRET_KEY
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
      restartPolicy: Always