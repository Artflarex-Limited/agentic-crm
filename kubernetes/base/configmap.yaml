apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-crm-config
  labels:
    app: agentic-crm
data:
  POSTGRES_DB: "agentic_crm"
  POSTGRES_USER: "postgres"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: agentic-crm-secrets
  labels:
    app: agentic-crm
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  SMTP_USER: ""
  SMTP_PASS: ""
  APOLLO_API_KEY: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""