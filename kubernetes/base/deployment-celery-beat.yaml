apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  labels:
    app: agentic-crm
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentic-crm
      component: celery-beat
  template:
    metadata:
      labels:
        app: agentic-crm
        component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: agentic-crm-backend:latest
          command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info", "--scheduler", "celery.schedulers.DatabaseScheduler"]
          envFrom:
            - configMapRef:
                name: agentic-crm-config
            - secretRef:
                name: agentic-crm-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128M
            limits:
              cpu: 500m
              memory: 512M