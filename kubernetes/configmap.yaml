apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-crm-config
  namespace: default
data:
  DATABASE_HOST: "postgres-svc"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "agentic_crm"
  DATABASE_USER: "agentic_user"
  REDIS_URL: "redis://redis-svc:6379/0"
  NGINX_PORT: "80"
  BACKEND_PORT: "8000"
  FRONTEND_PORT: "3000"
  CELERY_CONCURRENCY: "4"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-crm-frontend-config
  namespace: default
data:
  NEXT_PUBLIC_API_URL: "http://backend-svc:8000"
  NODE_ENV: "production"