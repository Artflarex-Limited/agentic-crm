[tool.poetry]
name = "agentic-crm-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for Agentic CRM"
authors = ["Artflarex Solutions <dev@artflarex.com>"]
readme = "README.md"
packages = [{include = "mcp_server", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastmcp = "^3.3.1"
httpx = ">=0.28.1"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]